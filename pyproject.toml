[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-maestro"
version = "1.5.5"
description = "Vendor-agnostic multi-agent orchestration runtime for AI coding assistants with milestone-guided project lifecycle and client dashboards."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Open Maestro Contributors" },
]
keywords = ["agents", "orchestration", "claude", "kimi", "mcp", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
claude-sdk = ["claude-agent-sdk>=0.2"]
kimi-acp = ["agent-client-protocol>=0.8,<0.11.0"]  # 0.11.0 removed session/set_model
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
maestro = "open_maestro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_maestro"]

# Bundle default agent and skill definitions inside the package so the wheel
# works out of the box after pip install. They are kept separate from the code
# package directories to avoid mixing Python modules with Markdown assets.
[tool.hatch.build.targets.wheel.force-include]
"agents" = "open_maestro/_bundled_agents"
"skills" = "open_maestro/_bundled_skills"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
