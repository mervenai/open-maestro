# Default vendor-neutral model capability registry.
# Override or extend in ~/.open-maestro/capabilities.yaml or
# .open-maestro/capabilities.yaml.
#
# Capabilities are approximate and should be updated as providers release new
# models.  Users can add new entries, override identifiers for a runtime, or
# tweak capability flags without changing code.
#
# Optional per-model endpoint (OpenAI-compatible runtimes only):
#   endpoint:
#     runtime: openai-sdk
#     base_url: https://api.example.com/v1
#     api_key_env: EXAMPLE_API_KEY   # env var holding the key
# When set, the openai-sdk runtime talks to that base URL with that key
# instead of the global OPENAI_BASE_URL / OPENAI_API_KEY.

models:
  kimi-coding-fast:
    name: "Kimi for Coding"
    provider: kimi
    aliases: [fast, default]
    identifiers:
      kimi-cli: kimi-code/kimi-for-coding
    capabilities:
      tier: fast
      tool_use: true
      vision: false
      computer_use: false
      reasoning: light
      coding_strength: high
      max_context_tokens: 256000
      max_output_tokens: 16384
      latency_hint: low
      cost_level: low
      relative_cost: 3.0

  kimi-k3:
    name: "Kimi K3"
    provider: kimi
    aliases: [smart, reasoning]
    identifiers:
      kimi-cli: kimi-code/k3
    capabilities:
      tier: premium
      tool_use: true
      vision: false
      computer_use: false
      reasoning: deep
      coding_strength: high
      max_context_tokens: 256000
      max_output_tokens: 16384
      latency_hint: medium
      cost_level: medium
      relative_cost: 3.5

